workflows:
  ios-capacitor-workflow:
    name: Build Slock iOS Native App
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 22.11.0
      xcode: latest
    scripts:
      - name: Initialize and Install Capacitor
        script: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --save
          npx cap init Slock com.slock.app --web-dir .
          npx cap add ios
          npx cap copy ios
      - name: Verify iOS Workspace Exists
        script: |
          if [ ! -d "ios/App" ]; then
            echo "Error: ios/App directory missing!"
            exit 1
          fi
          ls -la ios/App
      - name: Build iOS App Bundle
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

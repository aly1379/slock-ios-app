workflows:
  ios-capacitor-workflow:
    name: Build Slock iOS Native App
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 22.11.0
      xcode: latest
    scripts:
      - name: 1. Install Dependencies
        script: |
          npm install
      - name: 2. Create Capacitor Config
        script: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.slock.app",
            "appName": "Slock",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF
      - name: 3. Add iOS Platform
        script: |
          npx cap add ios
          npx cap sync ios
      - name: 4. Build IPA Package
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../../build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - build/Build/Products/Release-iphoneos/*.ipa

workflows:
  ios-capacitor-workflow:
    name: Build Slock iOS Native App
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 22.11.0
      xcode: latest
    scripts:
      - name: 1. Setup Dependencies and Config
        script: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --save
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.slock.app",
            "appName": "Slock",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF
      - name: 2. Generate iOS Platform Files
        script: |
          npx cap add ios --force
          npx cap sync ios
      - name: 3. Compile iOS App Archive
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../../build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - build/Build/Products/Release-iphoneos/*.ipa

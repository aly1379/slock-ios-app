workflows:
  ios-capacitor-workflow:
    name: Build Slock iOS Native App
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 18.16.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init Slock com.slock.app --web-dir .
          npx cap add ios
          npx cap copy ios
      - name: Build iOS App (.ipa / App Bundle)
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - build/Build/Products/Release-iphoneos/*.ipa

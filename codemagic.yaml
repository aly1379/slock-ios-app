workflows:
  ios-capacitor-workflow:
    name: Build Slock iOS Native App
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 18.16.0
      xcode: latest
    scripts:
      - name: Verify project files
        script: |
          ls -la
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi
      - name: Initialize and Install Capacitor
        script: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --save
          npx cap init Slock com.slock.app --web-dir .
          npx cap add ios
          npx cap copy ios
      - name: Build iOS App Bundle
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

workflows:
  ios-capacitor-workflow:
    name: Build Slock iOS Native App
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 22.11.0
      xcode: latest
    scripts:
      - name: 1. Setup Project & Dependencies
        script: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --save
      - name: 2. Create Capacitor Config
        script: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.slock.app",
            "appName": "Slock",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF
      - name: 3. Add iOS Platform & Sync
        script: |
          npx cap add ios
          npx cap copy ios
      - name: 4. Build iOS App (.ipa)
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - build/Build/Products/Release-iphoneos/*.ipa
